[project]
name = "linux3d"
version = "0.1.0"
description = "Parametric, printable Linux logos and mascots (Gentoo, Larry the Cow, KDE, Plasma, Konqi) as layered-colour standees on pedestals"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "build123d>=0.13.0",
    "numpy>=2",
    "pillow>=12.0.0",
    "shapely>=2.1.0",
    "svgelements>=1.9.6",
    "trimesh>=4.5.0",
]

[project.scripts]
linux3d = "linux3d:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "networkx>=3.4",
    "pytest>=8.3",
    "rtree>=1.3",
    "scipy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
